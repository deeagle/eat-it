---
name: lint

on:
  workflow_call:

jobs:
  lint-files:
    name: lint and style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.yml
          globs: '**/*.{md,markdown}'
